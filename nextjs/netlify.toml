# Netlify build for www.lava-sa.com (moved from Vercel, Nov 2026).
# In the Netlify UI set Base directory = nextjs; this file is read from there.
# Secrets live in the Netlify UI (Site configuration → Environment variables), never here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
