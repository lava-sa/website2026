# Netlify build for www.lava-sa.com (moved from Vercel, Nov 2026).
# The app lives in nextjs/; publish is relative to that base.
# Secrets live in the Netlify UI (Environment variables), never here.

[build]
  base = "nextjs"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js adapter; without it the raw .next folder is served as static files (all 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"
